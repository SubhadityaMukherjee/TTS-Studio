site_name: TTS Studio
site_description: A modular multi-engine text-to-speech CLI (kokoro, edge-tts, Breeze TTS 2)
site_url: https://subhadityamukherjee.github.io/TTS-Studio/
repo_url: https://github.com/SubhadityaMukherjee/TTS-Studio
repo_name: SubhadityaMukherjee/TTS-Studio

nav:
  - Home: index.md
  - Engines: engines.md
  - API Reference:
      - Overview: api.md
      - CLI: tts_studio/cli.md
      - Parsers: tts_studio/parsers.md
      - Processor: tts_studio/processor.md
      - Utils: tts_studio/utils.md
      - Breeze backend: tts_studio/breeze_fast.md

theme:
  name: material
  features:
    - content.code.copy
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode

    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      primary: indigo
      accent: indigo
      scheme: slate
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      linenums: true
  - pymdownx.inlinehilite
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [.]
          options:
            docstring_section_style: table
            show_docstring_functions: true
